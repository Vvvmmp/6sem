version: '3.8'

services:
  nginx-server:
    image: nginx:stable-alpine
    container_name: lab2-nginx
    ports:
      - "20000:20000"
      - "80:80"
      - "20443:20443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./:/usr/share/nginx/html
      - ./ssl:/etc/nginx/ssl:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"