services:
  mssql:
    platform: linux/amd64
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: lab_7_sql_server_2019
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SA_PASSWORD}
    volumes:
      - ./mssql_data:/var/opt/mssql

  nginx-proxy:
    image: nginx:latest
    container_name: lab_7_mssql_nginx_proxy
    restart: unless-stopped
    depends_on:
      - mssql
    ports:
      - "1433:1433" 
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  api-app:
    image: vampihe/tdwa07-01
    container_name: lab_7_tdwa07_api
    restart: unless-stopped
    depends_on:
      - nginx-proxy
    ports:
      - "8080:8080"
    environment:
      - DB_CONNECTION_STRING=Server=nginx-proxy;Database=Celebrities;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;