services:
  mssql:
    platform: linux/amd64
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: sql_server_2019
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - ${HOST_DATA_PATH}:/var/opt/mssql


  db-init:
    platform: linux/amd64
    image: mcr.microsoft.com/mssql/server:2019-latest 
    container_name: sql_server_init
    depends_on:
      - mssql
    volumes:
      - ./init.sql:/init.sql
    command: >
      /bin/bash -c "
      echo 'Waiting for the SQL Server launch';
      for i in {1..30}; do 
        /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P '${SA_PASSWORD}' -C -d master -Q 'SELECT 1' > /dev/null 2>&1 && break || sleep 2; 
      done;
      echo 'Execute init.sql...';
      /opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P '${SA_PASSWORD}' -C -i /init.sql;
      echo 'Completed';
      "

  nginx-proxy:
    image: nginx:latest
    container_name: mssql_nginx_proxy
    restart: unless-stopped
    depends_on:
      - mssql
    ports:
      - "1434:1433" 
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro