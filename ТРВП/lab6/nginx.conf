user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

stream {
    upstream mssql_backend {
        server mssql:1433; 
    }

    server {
        listen 1433; 
        proxy_pass mssql_backend; 
        proxy_connect_timeout 5s;
    }
}